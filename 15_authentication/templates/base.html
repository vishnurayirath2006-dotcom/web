<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flask Authentication</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="container narrow"><div class="top"><div><h1>Member Portal</h1><p class="muted">Secure registration and login</p></div><nav class="nav"><a href="{{ url_for('login') }}">Login</a><a href="{{ url_for('register') }}">Register</a></nav></div>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ 'error' if category == 'error' else '' }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
