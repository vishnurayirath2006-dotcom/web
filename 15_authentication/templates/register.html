{% extends "base.html" %}{% block content %}<section class="card"><h2>Create account</h2><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<div><label>Username</label><input name="username" required minlength="3" maxlength="30" autocomplete="username" value="{{ request.form.get('username','') }}"></div>
<div><label>Email</label><input type="email" name="email" required maxlength="120" autocomplete="email" value="{{ request.form.get('email','') }}"></div>
<div><label>Password</label><input type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password"></div>
<button>Create account</button></form><p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p></section>{% endblock %}
