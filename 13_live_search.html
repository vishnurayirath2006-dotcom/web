<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atlas Live Search</title>

    <style>
        :root {
            --ink: #1c2d42;
            --muted: #718196;
            --paper: #eaf0f5;
            --navy: #243c5a;
            --teal: #376c79;
            --accent: #ed9f5b;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 85% 8%, rgba(255, 255, 255, 0.75), transparent 22rem),
                var(--paper);
        }

        .hero {
            padding: 55px 7% 78px;
            color: white;
            background: linear-gradient(120deg, var(--navy), var(--teal));
        }

        .hero-inner {
            max-width: 900px;
            margin: auto;
        }

        .hero small {
            color: #b8e4dc;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 4px;
        }

        .hero h1 {
            margin: 12px 0 8px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(34px, 7vw, 56px);
            line-height: 1.05;
        }

        .hero p {
            max-width: 650px;
            margin: 0;
            color: #d1e0e7;
        }

        .wrap {
            max-width: 900px;
            margin: -38px auto 50px;
            padding: 0 18px;
        }

        .searchbox {
            display: flex;
            gap: 12px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 16px;
            background: var(--white);
            box-shadow: 0 15px 35px rgba(36, 60, 90, 0.16);
        }

        .searchbox input {
            min-width: 0;
            flex: 1;
            padding: 8px;
            border: 0;
            outline: 0;
            font-size: 17px;
        }

        .searchbox input:focus {
            color: var(--ink);
        }

        .searchbox button {
            min-height: 44px;
            padding: 12px 20px;
            border: 0;
            border-radius: 10px;
            color: white;
            background: var(--accent);
            font-weight: 800;
            cursor: pointer;
            transition: filter 150ms, transform 150ms;
        }

        .searchbox button:hover {
            filter: brightness(1.04);
            transform: translateY(-1px);
        }

        .status {
            min-height: 20px;
            padding: 17px 5px;
            color: var(--muted);
        }

        .results {
            display: grid;
            gap: 13px;
        }

        .item {
            padding: 19px 22px;
            border: 1px solid rgba(216, 226, 234, 0.85);
            border-radius: 13px;
            background: var(--white);
            box-shadow: 0 5px 16px rgba(36, 60, 90, 0.06);
            transition: transform 180ms, box-shadow 180ms;
        }

        .item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(36, 60, 90, 0.1);
        }

        .item h3 {
            margin: 0 0 8px;
            color: #275a70;
        }

        .item p {
            color: #687789;
            line-height: 1.5;
        }

        .item a {
            color: #b46c2e;
            font-weight: 800;
            text-decoration: none;
        }

        .item a:hover {
            text-decoration: underline;
        }

        .hint {
            padding: 35px;
            color: #8492a2;
            text-align: center;
        }

        @media (max-width: 560px) {
            .hero {
                padding: 38px 20px 68px;
            }

            .wrap {
                margin-top: -32px;
                padding: 0 12px;
            }

            .searchbox {
                flex-direction: column;
                padding: 12px;
            }

            .searchbox input {
                min-height: 44px;
                padding: 8px 10px;
            }

            .searchbox button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="hero">
        <div class="hero-inner">
            <small>ATLAS / INSTANT DISCOVERY</small>
            <h1>Curiosity, meet answers.</h1>
            <p>
                Search Wikipedia articles as you type.
                Results arrive without refreshing the page.
            </p>
        </div>
    </header>

    <main class="wrap">
        <form id="form" class="searchbox">
            <input
                id="query"
                type="search"
                placeholder="Try JavaScript, cinema, artificial intelligence…"
                aria-label="Search Wikipedia"
                autocomplete="off"
            >
            <button type="submit">Search</button>
        </form>

        <div id="status" class="status" aria-live="polite">
            Start typing to discover articles.
        </div>

        <section
            id="results"
            class="results"
            aria-label="Wikipedia search results"
        >
            <div class="hint">Your search results will appear here.</div>
        </section>
    </main>

    <script>
        const input = document.getElementById("query");
        const status = document.getElementById("status");
        const results = document.getElementById("results");
        let timer = null;
        let controller = null;

        function escapeHTML(text = "") {
            return text.replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[character]);
        }

        async function search(query) {
            if (controller) {
                controller.abort();
            }

            controller = new AbortController();
            const current = controller;

            if (!query) {
                status.textContent = "Start typing to discover articles.";
                results.innerHTML =
                    '<div class="hint">Your search results will appear here.</div>';
                return;
            }

            status.textContent = "Searching…";

            try {
                const url =
                    "https://en.wikipedia.org/w/api.php" +
                    "?action=query&generator=search" +
                    "&gsrsearch=" + encodeURIComponent(query) +
                    "&gsrnamespace=0&gsrlimit=10" +
                    "&prop=pageimages%7Cextracts" +
                    "&exintro=1&explaintext=1&exsentences=2" +
                    "&piprop=thumbnail&pithumbsize=160" +
                    "&format=json&origin=*";

                const response = await fetch(url, {
                    signal: current.signal
                });

                if (!response.ok) {
                    throw Error("Search service unavailable");
                }

                const data = await response.json();

                if (current !== controller) {
                    return;
                }

                const pages = Object.values(data.query?.pages || {})
                    .sort((first, second) => first.index - second.index);

                status.textContent =
                    `${pages.length} results for “${query}”`;
                results.innerHTML = pages.length
                    ? pages.map(page => `
                        <article class="item">
                            <h3>${escapeHTML(page.title)}</h3>
                            <p>${escapeHTML(page.extract || "No preview available.")}</p>
                            <a
                                target="_blank"
                                rel="noopener"
                                href="https://en.wikipedia.org/?curid=${page.pageid}"
                            >Read article ↗</a>
                        </article>
                    `).join("")
                    : '<div class="hint">No results found. Try a different keyword.</div>';
            } catch (error) {
                if (error.name !== "AbortError") {
                    status.textContent =
                        "Could not fetch results. Check your connection and try again.";
                }
            }
        }

        input.addEventListener("input", () => {
            clearTimeout(timer);
            const query = input.value.trim();
            timer = setTimeout(() => search(query), 300);
        });

        document.getElementById("form").addEventListener("submit", event => {
            event.preventDefault();
            clearTimeout(timer);
            search(input.value.trim());
        });
    </script>
</body>
</html>
