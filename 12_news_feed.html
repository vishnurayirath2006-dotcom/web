<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pulse Newsroom</title>

    <style>
        :root {
            --ink: #242a35;
            --paper: #f4f2ed;
            --navy: #182c42;
            --gold: #d78d42;
            --muted: #7c8188;
            --line: #d9d8d3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background: var(--paper);
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }

        .mast {
            padding: 30px 7%;
            color: white;
            background:
                radial-gradient(circle at 85% 20%, rgba(241, 184, 107, 0.12), transparent 20rem),
                var(--navy);
        }

        .mast-inner {
            max-width: 1150px;
            margin: auto;
        }

        .mast small {
            color: #f1b86b;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 4px;
        }

        .mast h1 {
            margin: 10px 0 8px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(38px, 7vw, 52px);
            line-height: 1.05;
        }

        .mast p {
            margin: 0;
            color: #c4d0dc;
        }

        .wrap {
            max-width: 1150px;
            margin: 28px auto;
            padding: 0 20px 40px;
        }

        .tools {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tools input {
            min-width: 220px;
            flex: 1;
            padding: 13px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: border-color 150ms, box-shadow 150ms;
        }

        .tools input:focus {
            border-color: #b47b43;
            box-shadow: 0 0 0 4px rgba(215, 141, 66, 0.12);
        }

        .tools button {
            min-height: 44px;
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            color: white;
            background: var(--gold);
            font-weight: 800;
            cursor: pointer;
            transition: filter 150ms, transform 150ms;
        }

        .tools button:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
        }

        .note {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        #status {
            min-height: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 22px;
        }

        .article {
            overflow: hidden;
            border: 1px solid rgba(217, 216, 211, 0.7);
            border-radius: 14px;
            background: white;
            box-shadow: 0 8px 22px rgba(40, 56, 74, 0.08);
            transition: transform 180ms, box-shadow 180ms;
        }

        .article:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 30px rgba(40, 56, 74, 0.12);
        }

        .article img {
            width: 100%;
            height: 175px;
            display: block;
            object-fit: cover;
            background: #dce4e8;
        }

        .body {
            padding: 18px;
        }

        .source {
            color: #b46c28;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .body h2 {
            margin: 9px 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 20px;
            line-height: 1.3;
        }

        .body p {
            color: #666e78;
            line-height: 1.5;
        }

        .body a {
            color: #1d6485;
            font-weight: 800;
            text-decoration: none;
        }

        .body a:hover {
            text-decoration: underline;
        }

        .empty {
            grid-column: 1 / -1;
            padding: 35px;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 560px) {
            .mast {
                padding: 26px 20px;
            }

            .wrap {
                margin-top: 18px;
                padding: 0 12px 28px;
            }

            .tools input {
                min-width: 100%;
            }

            .tools button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="mast">
        <div class="mast-inner">
            <small>PULSE / THE DAILY BRIEF</small>
            <h1>Stories that move the world.</h1>
            <p>A live news feed, gathered from a public RSS-to-JSON service.</p>
        </div>
    </header>

    <main class="wrap">
        <div class="tools">
            <input
                id="search"
                type="search"
                placeholder="Filter loaded headlines..."
                aria-label="Filter loaded headlines"
            >
            <button id="refresh" type="button">↻ Refresh feed</button>
        </div>

        <p class="note">
            This demo uses the BBC News RSS feed through rss2json.
            Public conversion services may impose usage limits; if it fails, try again later.
        </p>
        <div id="status" class="note" aria-live="polite">Loading headlines…</div>
        <section id="feed" class="grid" aria-label="News articles"></section>
    </main>

    <script>
        const get = id => document.getElementById(id);
        let articles = [];

        function safe(text = "") {
            return String(text).replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[character]);
        }

        function render() {
            const query = get("search").value.toLowerCase();
            const items = articles.filter(article =>
                (article.title || "").toLowerCase().includes(query) ||
                (article.description || "").toLowerCase().includes(query)
            );

            get("feed").innerHTML = items.length
                ? items.map(article => `
                    <article class="article">
                        ${article.thumbnail
                            ? `<img src="${safe(article.thumbnail)}" alt="">`
                            : ""}
                        <div class="body">
                            <div class="source">
                                ${safe(article.author || "BBC NEWS")}
                            </div>
                            <h2>${safe(article.title)}</h2>
                            <p>
                                ${safe(
                                    (article.description || "")
                                        .replace(/<[^>]*>/g, "")
                                        .slice(0, 170)
                                )}
                            </p>
                            <p class="note">
                                ${article.pubDate
                                    ? new Date(article.pubDate).toLocaleString()
                                    : ""}
                            </p>
                            <a
                                href="${safe(article.link)}"
                                target="_blank"
                                rel="noopener"
                            >Read full story ↗</a>
                        </div>
                    </article>
                `).join("")
                : '<div class="empty">No matching headlines found.</div>';
        }

        async function load() {
            get("status").textContent = "Loading latest headlines…";
            get("feed").innerHTML = "";

            try {
                const url =
                    "https://api.rss2json.com/v1/api.json?rss_url=" +
                    encodeURIComponent("https://feeds.bbci.co.uk/news/rss.xml");
                const response = await fetch(url);

                if (!response.ok) {
                    throw Error("Feed service request failed.");
                }

                const data = await response.json();

                if (data.status !== "ok") {
                    throw Error(data.message || "Could not load the news feed.");
                }

                articles = data.items || [];
                get("status").textContent =
                    `Loaded ${articles.length} headlines • ${new Date().toLocaleTimeString()}`;
                render();
            } catch (error) {
                get("status").textContent =
                    `Unable to load news: ${error.message}`;
                get("feed").innerHTML = `
                    <div class="empty">
                        Check your internet connection or try Refresh feed.
                        Some public RSS conversion services may be temporarily unavailable.
                    </div>
                `;
            }
        }

        get("search").addEventListener("input", render);
        get("refresh").addEventListener("click", load);
        load();
    </script>
</body>
</html>
