{% extends "base.html" %}{% block content %}<section class="card"><h2>Edit employee #{{ employee.id }}</h2><form method="post"><div class="gridform">
<div><label>Name</label><input name="name" maxlength="80" required value="{{ employee.name }}"></div><div><label>Email</label><input type="email" name="email" required value="{{ employee.email }}"></div>
<div><label>Department</label><input name="department" maxlength="60" required value="{{ employee.department }}"></div><div><label>Job title</label><input name="role" maxlength="60" required value="{{ employee.role }}"></div>
<div><label>Salary</label><input type="number" name="salary" min="0" step="0.01" required value="{{ employee.salary }}"></div></div><div class="actions"><button>Save changes</button><a class="btn secondary" href="{{ url_for('index') }}">Cancel</a></div></form></section>{% endblock %}
