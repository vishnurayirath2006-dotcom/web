{% extends "base.html" %}{% block content %}<section class="card"><h2>Edit record #{{ record.id }}</h2><form method="post"><div><label>Title</label><input name="title" maxlength="100" required value="{{ record.title }}"></div><div><label>Description</label><textarea name="description" maxlength="1000">{{ record.description }}</textarea></div><div class="actions"><button>Save changes</button><a class="btn secondary" href="{{ url_for('index') }}">Cancel</a></div></form></section>{% endblock %}
