<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flask CRUD App</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="container"><div class="top"><div><h1>Record Manager</h1><p class="muted">Create · Read · Update · Delete</p></div></div>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ 'error' if category == 'error' else '' }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
