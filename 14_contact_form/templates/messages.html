{% extends "base.html" %}{% block content %}<section class="card"><h2>Submitted messages</h2>{% if rows %}<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Message</th><th>Date</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.name }}</td><td>{{ row.email }}</td><td>{{ row.message }}</td><td>{{ row.created_at }}</td></tr>{% endfor %}</tbody></table></div>{% else %}<p class="empty">No messages submitted yet.</p>{% endif %}</section>{% endblock %}
