<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atmos Weather</title>

    <style>
        :root {
            --ink: #183047;
            --white: #ffffff;
            --ocean: #24506b;
            --accent: #ffc879;
            --tile: #eef6f8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 35px 18px;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.8), transparent 20rem),
                linear-gradient(135deg, #c5e7f4, #e9f3fa 55%, #f8e5c8);
        }

        .wrap {
            max-width: 850px;
            margin: auto;
        }

        .brand {
            color: #47728b;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .hero {
            margin-top: 22px;
            padding: 35px;
            border-radius: 25px;
            color: white;
            background: linear-gradient(120deg, var(--ocean), #3f8c9b);
            box-shadow: 0 20px 45px rgba(42, 98, 115, 0.17);
        }

        .hero h1 {
            margin: 12px 0 8px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(34px, 8vw, 48px);
        }

        .hero p {
            margin: 0;
            color: #dbeaf0;
        }

        .eyebrow {
            color: #c8e4e9;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .search {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .search input {
            min-width: 0;
            flex: 1;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
        }

        .search input:focus {
            box-shadow: 0 0 0 4px rgba(255, 200, 121, 0.28);
        }

        .search button {
            min-width: 96px;
            border: 0;
            border-radius: 10px;
            color: #25364a;
            background: var(--accent);
            font-weight: 800;
            cursor: pointer;
            transition: filter 150ms, transform 150ms;
        }

        .search button:hover {
            filter: brightness(1.04);
            transform: translateY(-1px);
        }

        .weather {
            display: none;
            margin-top: 20px;
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.86);
            box-shadow: 0 16px 40px rgba(51, 98, 115, 0.11);
            backdrop-filter: blur(10px);
        }

        .main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        #place {
            margin-bottom: 4px;
            color: #5a7588;
            font-weight: 700;
        }

        .temp {
            font-size: clamp(52px, 12vw, 65px);
            font-weight: 800;
            line-height: 1.1;
        }

        #condition {
            margin-top: 6px;
            color: #5a7588;
        }

        .icon {
            font-size: clamp(60px, 12vw, 70px);
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 22px;
        }

        .tile {
            padding: 18px;
            border-radius: 13px;
            background: var(--tile);
        }

        .tile b {
            display: block;
            margin-top: 8px;
            font-size: 22px;
        }

        .status {
            min-height: 20px;
            margin-top: 15px;
            color: #d7edf0;
        }

        @media (max-width: 600px) {
            body {
                padding: 24px 12px;
            }

            .hero {
                padding: 26px 20px;
                border-radius: 20px;
            }

            .search {
                flex-direction: column;
            }

            .search button {
                min-height: 48px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .weather {
                padding: 22px 18px;
            }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <div class="brand">ATMOS / WEATHER INTELLIGENCE</div>

        <section class="hero">
            <div class="eyebrow">YOUR CITY, YOUR SKY</div>
            <h1>Feel the forecast.</h1>
            <p>Search a city to see its current weather conditions.</p>

            <form class="search" id="form">
                <input
                    id="city"
                    type="search"
                    placeholder="Enter a city (e.g. Kochi)"
                    autocomplete="off"
                    required
                >
                <button type="submit">Search</button>
            </form>

            <div id="status" class="status" aria-live="polite">
                Powered by Open-Meteo • No API key required
            </div>
        </section>

        <section id="weather" class="weather" aria-live="polite">
            <div class="main">
                <div>
                    <div id="place"></div>
                    <div id="temp" class="temp"></div>
                    <div id="condition"></div>
                </div>
                <div id="icon" class="icon">🌤️</div>
            </div>

            <div class="details">
                <div class="tile">Feels-like<b id="feels"></b></div>
                <div class="tile">Humidity<b id="humidity"></b></div>
                <div class="tile">Wind speed<b id="wind"></b></div>
            </div>
        </section>
    </main>

    <script>
        const get = id => document.getElementById(id);

        function describe(code) {
            if (code === 0) return ["Clear sky", "☀️"];
            if ([1, 2, 3].includes(code)) return ["Partly cloudy", "⛅"];
            if ([45, 48].includes(code)) return ["Foggy", "🌫️"];
            if ([51, 53, 55, 56, 57].includes(code)) return ["Drizzle", "🌦️"];
            if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return ["Rain", "🌧️"];
            if ([71, 73, 75, 77, 85, 86].includes(code)) return ["Snow", "❄️"];
            if ([95, 96, 99].includes(code)) return ["Thunderstorm", "⛈️"];
            return ["Changing conditions", "🌤️"];
        }

        async function loadWeather(city) {
            get("status").textContent = "Searching for your city…";
            get("weather").style.display = "none";

            try {
                const geo = await fetch(
                    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`
                );

                if (!geo.ok) {
                    throw Error("Could not reach the location service.");
                }

                const geoData = await geo.json();

                if (!geoData.results?.length) {
                    throw Error("City not found. Check the spelling and try again.");
                }

                const place = geoData.results[0];
                get("status").textContent = "Fetching current conditions…";

                const url =
                    `https://api.open-meteo.com/v1/forecast` +
                    `?latitude=${place.latitude}&longitude=${place.longitude}` +
                    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw Error("Weather service is temporarily unavailable.");
                }

                const data = await response.json();
                const current = data.current;
                const [label, emoji] = describe(current.weather_code);

                get("place").textContent =
                    [place.name, place.admin1, place.country]
                        .filter(Boolean)
                        .join(", ");
                get("temp").textContent =
                    `${Math.round(current.temperature_2m)}°C`;
                get("condition").textContent = label;
                get("icon").textContent = emoji;
                get("feels").textContent =
                    `${Math.round(current.apparent_temperature)}°C`;
                get("humidity").textContent =
                    `${current.relative_humidity_2m}%`;
                get("wind").textContent =
                    `${current.wind_speed_10m} km/h`;

                get("weather").style.display = "block";
                get("status").textContent =
                    `Updated: ${new Date(current.time).toLocaleString()}`;
            } catch (error) {
                get("status").textContent = error.message;
            }
        }

        get("form").addEventListener("submit", event => {
            event.preventDefault();
            const city = get("city").value.trim();

            if (city) {
                loadWeather(city);
            }
        });

        get("city").value = "Kochi";
        loadWeather("Kochi");
    </script>
</body>
</html>
