<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tempo Clock</title>

    <style>
        :root {
            --white: #f7f8ff;
            --glass: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
            --soft-blue: #c4d3ee;
            --blue: #a9c5f5;
            --orange: #f2a95d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 35px 18px;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: var(--white);
            background:
                radial-gradient(circle at 10% 10%, rgba(87, 121, 176, 0.45), transparent 28rem),
                radial-gradient(circle at top left, #344e78, #10182c 65%);
        }

        .wrap {
            max-width: 900px;
            margin: auto;
        }

        .brand {
            color: var(--blue);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 4px;
        }

        h1 {
            margin: 12px 0 6px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(34px, 7vw, 48px);
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            margin-top: 25px;
        }

        .panel {
            min-height: 340px;
            padding: 28px;
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            background: var(--glass);
            box-shadow: 0 18px 50px rgba(4, 10, 27, 0.18);
            backdrop-filter: blur(10px);
        }

        .time {
            margin: 30px 0 8px;
            font-size: clamp(42px, 8vw, 72px);
            font-weight: 800;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
        }

        .date {
            color: var(--soft-blue);
            font-size: 18px;
        }

        .zone {
            color: #91a8cc;
        }

        .calendar-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .calendar-head h2 {
            margin: 0;
            font-size: 19px;
            text-align: center;
        }

        .calendar-head button {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 10px;
            color: white;
            background: rgba(255, 255, 255, 0.12);
            font-size: 22px;
            cursor: pointer;
            transition: background 150ms, transform 150ms;
        }

        .calendar-head button:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: translateY(-1px);
        }

        .days,
        .dates {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 7px;
            text-align: center;
        }

        .days {
            margin-bottom: 10px;
            color: #9db3d9;
            font-size: 12px;
        }

        .dates span {
            display: grid;
            min-height: 38px;
            place-items: center;
            border-radius: 10px;
            font-variant-numeric: tabular-nums;
        }

        .today {
            color: #1b2338;
            background: var(--orange);
            font-weight: 800;
        }

        .caption {
            color: #b8c8e5;
        }

        @media (max-width: 650px) {
            body {
                padding: 24px 12px;
            }

            .layout {
                grid-template-columns: 1fr;
            }

            .panel {
                min-height: 0;
                padding: 22px 18px;
            }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <div class="brand">TEMPO • YOUR MOMENT</div>
        <h1>Time, beautifully organised.</h1>
        <p class="caption">A live clock and a calendar for the month ahead.</p>

        <div class="layout">
            <section class="panel" aria-label="Current local time">
                <div>LOCAL TIME</div>
                <div id="clock" class="time" aria-live="off">--:--:--</div>
                <div id="date" class="date"></div>
                <p id="zone" class="zone"></p>
            </section>

            <section class="panel" aria-label="Calendar">
                <div class="calendar-head">
                    <button id="prev" type="button" aria-label="Previous month">‹</button>
                    <h2 id="month"></h2>
                    <button id="next" type="button" aria-label="Next month">›</button>
                </div>

                <div class="days" aria-hidden="true">
                    <span>Sun</span>
                    <span>Mon</span>
                    <span>Tue</span>
                    <span>Wed</span>
                    <span>Thu</span>
                    <span>Fri</span>
                    <span>Sat</span>
                </div>
                <div id="dates" class="dates"></div>
            </section>
        </div>
    </main>

    <script>
        const now = new Date();
        let shown = new Date(now.getFullYear(), now.getMonth(), 1);

        function updateClock() {
            const date = new Date();

            document.getElementById("clock").textContent =
                date.toLocaleTimeString("en-IN", { hour12: true });
            document.getElementById("date").textContent =
                date.toLocaleDateString("en-IN", {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                });
            document.getElementById("zone").textContent =
                Intl.DateTimeFormat().resolvedOptions().timeZone;
        }

        function drawCalendar() {
            const year = shown.getFullYear();
            const month = shown.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const dayCount = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            document.getElementById("month").textContent =
                shown.toLocaleDateString("en-IN", {
                    month: "long",
                    year: "numeric"
                });

            let html = "";

            for (let i = 0; i < firstDay; i++) {
                html += "<span></span>";
            }

            for (let day = 1; day <= dayCount; day++) {
                const isToday =
                    day === today.getDate() &&
                    month === today.getMonth() &&
                    year === today.getFullYear();

                html += `<span class="${isToday ? "today" : ""}">${day}</span>`;
            }

            document.getElementById("dates").innerHTML = html;
        }

        document.getElementById("prev").addEventListener("click", () => {
            shown.setMonth(shown.getMonth() - 1);
            drawCalendar();
        });

        document.getElementById("next").addEventListener("click", () => {
            shown.setMonth(shown.getMonth() + 1);
            drawCalendar();
        });

        updateClock();
        drawCalendar();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
